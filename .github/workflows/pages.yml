name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site and portfolio media
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html app.js style.css _site/
          for asset in space.jpg gun.jpg scripts.jpg racing.jpg gun-showcase.mp4 scripts.mp4; do
            if [ ! -s "assets/$asset" ]; then
              curl --fail --location --retry 3 "https://playable-portfolio.backup67676767677676.chatgpt.site/assets/$asset" -o "assets/$asset"
            fi
          done
          cp assets/* _site/assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Store portfolio media in repository for reliable publishing"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
