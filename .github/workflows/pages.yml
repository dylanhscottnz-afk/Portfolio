name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site and portfolio media
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html app.js style.css _site/
          for asset in space.jpg gun.jpg scripts.jpg racing.jpg steal.jpg bomb.jpg gun-showcase.mp4 scripts.mp4; do
            curl --fail --location --retry 3 "https://playable-portfolio.backup67676767677676.chatgpt.site/assets/$asset" -o "_site/assets/$asset"
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
